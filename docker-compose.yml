version: '3.1'
services:
  postgres:
    image: postgres:16
    container_name: ciyex-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ciyexdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      args:
        ENVIRONMENT: stage   # Use 'prod' for production, 'stage' for staging
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local    # Or 'prod', 'dev', etc.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ciyexdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

volumes:
  databasevolume: {}
  pgdata: {}