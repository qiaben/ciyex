version: '3.1'
services:
  mysql:
    restart: always
    image: mariadb:10.5
    command: ['mysqld','--character-set-server=utf8mb4']
    ports:
      - 3306:3306
    volumes:
      - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ciyexdb

  app:
    build:
      context: .
      args:
        ENVIRONMENT: stage   # Use 'prod' for production, 'stage' for staging
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local    # Or 'prod', 'dev', etc.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ciyexdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  databasevolume: {}
