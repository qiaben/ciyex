name: Build & Deploy Ciyex App Production

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ciyex-app-prod
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  VERSION: v1.0.${{ github.run_number }}

jobs:
  build-and-deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64]
    environment:
      name: production
      url: https://api.ciyex.com

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Login to Registry
        run: |
          echo "${{ secrets.PROD_REGISTRY_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.PROD_REGISTRY_USERNAME }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build --build-arg ENVIRONMENT=prod -t $REGISTRY/$IMAGE_NAME:$VERSION .
          docker push $REGISTRY/$IMAGE_NAME:$VERSION
          echo "✅ Image pushed: $REGISTRY/$IMAGE_NAME:$VERSION"

      - name: Update image in kustomization
        run: |
          sed -i "s|newName: IMAGE_URL|newName: $REGISTRY/$IMAGE_NAME|g" k8s/overlays/prod/kustomization.yaml
          sed -i "s|newTag: IMAGE_TAG|newTag: $VERSION|g" k8s/overlays/prod/kustomization.yaml

      - name: Configure kubectl for production
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > /tmp/kube-prod.yaml
          echo "KUBECONFIG=/tmp/kube-prod.yaml" >> $GITHUB_ENV

      - name: Create registry pull secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=$REGISTRY \
            --docker-username=${{ secrets.PROD_REGISTRY_USERNAME }} \
            --docker-password=${{ secrets.PROD_REGISTRY_PASSWORD }} \
            --namespace default \
            --dry-run=client -o yaml | kubectl apply -f - --validate=false || true

      - name: Deploy to Kubernetes
        run: kubectl apply -k k8s/overlays/prod --validate=false

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/prod-ciyex-app -n default --timeout=10m
          kubectl get pods -l app=ciyex-app -n default -o wide

  notify:
    name: Notify Team
    if: always()
    runs-on: [self-hosted, linux, x64]
    needs: [build-and-deploy]

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Microsoft Teams notification
        run: |
          TEAMS_WEBHOOK="${{ secrets.TEAMS_WEBHOOK_URL }}"
          if [ -z "$TEAMS_WEBHOOK" ]; then
            echo "⚠️ TEAMS_WEBHOOK_URL secret not configured, skipping notification"
            exit 0
          fi

          STATUS_COLOR="28a745"
          if [ "${{ steps.status.outputs.status }}" == "failure" ]; then
            STATUS_COLOR="dc3545"
          fi

          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "'"$STATUS_COLOR"'",
            "summary": "Ciyex Backend Production Deployment ${{ steps.status.outputs.status }}",
            "sections": [{
              "activityTitle": "${{ steps.status.outputs.emoji }} Ciyex Backend Production Deployment ${{ steps.status.outputs.status }}",
              "activitySubtitle": "Version ${{ env.VERSION }}",
              "facts": [
                {"name": "Environment:", "value": "Production"},
                {"name": "Version:", "value": "${{ env.VERSION }}"},
                {"name": "Deployed by:", "value": "${{ github.actor }}"},
                {"name": "Commit:", "value": "${{ github.sha }}"},
                {"name": "URL:", "value": "https://api.ciyex.com"}
              ],
              "markdown": true
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View Workflow",
              "targets": [{"os": "default", "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]
            }]
          }' "$TEAMS_WEBHOOK"
