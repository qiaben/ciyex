apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ciyex-dev

namePrefix: dev-502-

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
      practice: "502"

replicas:
  - name: ciyex-app
    count: 1

patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
