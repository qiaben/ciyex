apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

namePrefix: prod-

bases:
  - ../../base

commonLabels:
  environment: prod

replicas:
  - name: ciyex-app
    count: 2

images:
  - name: IMAGE_URL
    newName: IMAGE_URL
    newTag: IMAGE_TAG

patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
