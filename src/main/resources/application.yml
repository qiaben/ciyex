spring:
  application:
    name: ciyex
  datasource:
    url: jdbc:postgresql://localhost:5432/ciyexdb
    username: postgres
    password: ***REMOVED_POSTGRES_PASSWORD***
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.hbm2ddl.create_namespaces: true
  flyway:
    enabled: false

jwt:
  secret: ***REMOVED_JWT_SECRET***
  expiration: 31557600000

cors:
  allowed-origins: http://localhost:3000

logging:
  level:
    root: info

ciyex:
  env: ${CIYEX_ENV:local}
